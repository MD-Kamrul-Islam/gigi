<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gigi — College of Business concierge</title>
<style>
/* ===========================================================================
   GBB brand kit. Only these three colors are official; the red-to-black
   gradient is the one addition, used in exactly one place (the crest) so it
   reads as deliberate rather than decoration.
   =========================================================================== */
:root{
  --cherry:#990011;
  --cherry-lift:#B4142A;   /* hover/active only, derived from cherry */
  --ink:#1A1A1A;
  --cream:#F5F0ED;
  --rule:rgba(26,26,26,.14);
  --muted:rgba(26,26,26,.62);
  --crest:linear-gradient(150deg,var(--cherry) 0%,#5E0410 55%,var(--ink) 100%);

  /* Cambria/Calibri are Windows fonts; the fallbacks keep the same
     proportions on Mac, Android and Linux. */
  --serif:Cambria,Georgia,"Times New Roman",serif;
  --sans:Calibri,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- shell: sidebar + conversation ---------- */
.shell{display:flex;height:100dvh;overflow:hidden}

.sidebar{
  width:270px;flex-shrink:0;background:var(--ink);color:var(--cream);
  display:flex;flex-direction:column;padding:22px 18px;
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.crest{
  width:40px;height:40px;border-radius:50%;background:var(--crest);
  display:grid;place-items:center;flex-shrink:0;
}
.crest svg{width:23px;height:23px}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:13px;color:rgba(245,240,237,.6)}

.new-chat{
  width:100%;background:transparent;color:var(--cream);
  border:1px solid rgba(245,240,237,.28);border-radius:9px;
  padding:10px 14px;text-align:left;margin-bottom:22px;
  transition:background .15s,border-color .15s;
}
.new-chat:hover{background:rgba(245,240,237,.08);border-color:rgba(245,240,237,.5)}

.recents-label{
  font-size:13px;color:rgba(245,240,237,.5);margin:0 0 9px 2px;
}
.recents{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.recents li{margin-bottom:3px}
.recents button{
  width:100%;text-align:left;background:transparent;border:0;border-radius:7px;
  padding:8px 10px;font-size:14.5px;color:rgba(245,240,237,.82);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recents button:hover{background:rgba(245,240,237,.09)}
.recents button[aria-current="true"]{background:rgba(245,240,237,.14);color:var(--cream)}
.recents-empty{font-size:14px;color:rgba(245,240,237,.4);padding:2px}

.sidebar-foot{font-size:12.5px;color:rgba(245,240,237,.45);padding-top:14px}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

.topbar{
  display:none;align-items:center;gap:10px;padding:12px 16px;
  background:var(--ink);color:var(--cream);
}
.topbar .crest{width:31px;height:31px}
.topbar .crest svg{width:18px;height:18px}
.topbar h1{font-family:var(--serif);font-size:17px;margin:0;font-weight:600}
.topbar .new-chat{width:auto;margin:0 0 0 auto;padding:6px 12px;font-size:14px}

/* ---------- welcome ---------- */
.thread{flex:1;overflow-y:auto;padding:30px 22px 12px;scroll-behavior:smooth}
.inner{max-width:680px;margin:0 auto}

.welcome{padding:34px 0 8px}
.welcome h2{
  font-family:var(--serif);font-size:34px;line-height:1.2;margin:0 0 10px;font-weight:600;
}
.welcome p{margin:0 0 26px;color:var(--muted);max-width:52ch}
.chips{display:flex;flex-direction:column;gap:9px}
.chip{
  background:#fff;border:1px solid var(--rule);border-radius:11px;
  padding:13px 15px;text-align:left;font-size:15.5px;
  transition:border-color .15s,transform .15s;
}
.chip:hover{border-color:var(--cherry);transform:translateX(2px)}

/* ---------- messages ---------- */
.msg{margin-bottom:26px}
.msg.student{display:flex;justify-content:flex-end}
.msg.student .bubble{
  background:var(--ink);color:var(--cream);border-radius:14px 14px 3px 14px;
  padding:11px 15px;max-width:82%;
}
.gigi-row{display:flex;gap:12px;align-items:flex-start}
.gigi-avatar{
  width:31px;height:31px;border-radius:50%;background:var(--crest);
  display:grid;place-items:center;flex-shrink:0;margin-top:2px;
}
.gigi-avatar svg{width:18px;height:18px}
.gigi-body{flex:1;min-width:0}
.answer{white-space:pre-wrap;word-wrap:break-word}
.answer a{color:var(--cherry);text-decoration:underline;text-underline-offset:2px}

.sources{margin-top:13px;border-top:1px solid var(--rule);padding-top:11px}
.sources a{
  display:block;color:var(--ink);text-decoration:none;font-size:14.5px;
  padding:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sources a:hover{color:var(--cherry);text-decoration:underline}
.src-office{color:var(--muted);font-size:13px}

.meta{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.confidence{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule);display:block}
.confidence.high .dots i{background:var(--cherry)}
.confidence.medium .dots i:nth-child(-n+2){background:var(--cherry)}
.confidence.low .dots i:nth-child(1){background:var(--cherry)}

.rate{display:flex;gap:5px}
.rate button{
  background:transparent;border:1px solid var(--rule);border-radius:7px;
  padding:4px 9px;font-size:14px;line-height:1;transition:border-color .15s,background .15s;
}
.rate button:hover{border-color:var(--cherry)}
.rate button[aria-pressed="true"]{background:var(--cherry);border-color:var(--cherry);color:#fff}
.rate-thanks{font-size:13.5px;color:var(--muted)}

.report{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.report textarea{
  font:inherit;font-size:15px;border:1px solid var(--rule);border-radius:9px;
  padding:10px 12px;resize:vertical;min-height:64px;background:#fff;color:var(--ink);
}
.report textarea:focus{outline:2px solid var(--cherry);outline-offset:1px;border-color:transparent}
.report-actions{display:flex;gap:8px}
.report button{
  background:var(--cherry);color:#fff;border:0;border-radius:8px;padding:8px 15px;font-size:14.5px;
}
.report button:hover{background:var(--cherry-lift)}
.report button.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}

.thinking{display:flex;gap:5px;padding:6px 0}
.thinking i{
  width:7px;height:7px;border-radius:50%;background:var(--cherry);opacity:.35;
  animation:pulse 1.3s infinite;
}
.thinking i:nth-child(2){animation-delay:.18s}
.thinking i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}

/* ---------- composer ---------- */
.composer{padding:12px 22px 20px;background:linear-gradient(to top,var(--cream) 72%,transparent)}
.composer-inner{max-width:680px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
.composer textarea{
  flex:1;font:inherit;font-size:16.5px;border:1px solid var(--rule);border-radius:12px;
  padding:13px 15px;resize:none;max-height:150px;background:#fff;color:var(--ink);
}
.composer textarea:focus{outline:2px solid var(--cherry);outline-offset:1px;border-color:transparent}
.send{
  background:var(--cherry);color:#fff;border:0;border-radius:11px;
  width:47px;height:47px;display:grid;place-items:center;flex-shrink:0;
}
.send:hover:not(:disabled){background:var(--cherry-lift)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:20px;height:20px}
.disclaimer{
  max-width:680px;margin:9px auto 0;font-size:12.5px;color:var(--muted);text-align:center;
}

:focus-visible{outline:2px solid var(--cherry);outline-offset:2px}

@media (max-width:820px){
  .sidebar{display:none}
  .topbar{display:flex}
  .thread{padding:20px 16px 8px}
  .composer{padding:10px 16px 16px}
  .welcome{padding:18px 0 4px}
  .welcome h2{font-size:27px}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="crest" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5F0ED" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14c0-3.9 3.1-7 7-7h3l3-2.5V8c1.6.9 2.6 2.6 2.6 4.4 0 3.6-3 6.6-6.6 6.6H8l-4 2.5V14Z"/>
          <circle cx="15.4" cy="10.4" r=".9" fill="#F5F0ED" stroke="none"/>
        </svg>
      </span>
      <div>
        <h1>Gigi</h1>
        <p>Graduate Business Birds</p>
      </div>
    </div>

    <button class="new-chat" id="newChat">Start a new chat</button>

    <p class="recents-label">Recent</p>
    <ul class="recents" id="recents"></ul>

    <div class="sidebar-foot">Illinois State University<br>College of Business</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="crest" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5F0ED" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14c0-3.9 3.1-7 7-7h3l3-2.5V8c1.6.9 2.6 2.6 2.6 4.4 0 3.6-3 6.6-6.6 6.6H8l-4 2.5V14Z"/>
          <circle cx="15.4" cy="10.4" r=".9" fill="#F5F0ED" stroke="none"/>
        </svg>
      </span>
      <h1>Gigi</h1>
      <button class="new-chat" id="newChatMobile">New chat</button>
    </div>

    <div class="thread" id="thread">
      <div class="inner" id="inner"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <label for="input" class="sr-only" style="position:absolute;left:-9999px">Your question</label>
        <textarea id="input" rows="1" placeholder="Ask about programs, scholarships, advising, student orgs…"></textarea>
        <button class="send" id="send" aria-label="Send question">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
        </button>
      </div>
      <p class="disclaimer">Gigi points you to College of Business pages. Always confirm details with the office involved.</p>
    </div>
  </main>
</div>

<script>
/* ===========================================================================
   Frontend logic. Deliberately plain JavaScript -- no build step, no
   framework, so you can open this file and edit it directly.

   State model:
     chats[]  one entry per conversation: {id, title, messages[]}
     messages entries are {role:"user"|"assistant", content, ...meta}
   Saved to localStorage so a student's recent chats survive a refresh.
   Nothing is sent anywhere except the question + recent turns.
   =========================================================================== */

const els = {
  thread: document.getElementById('thread'),
  inner: document.getElementById('inner'),
  input: document.getElementById('input'),
  send: document.getElementById('send'),
  recents: document.getElementById('recents'),
};

let chats = [];
let activeId = null;
let busy = false;
let welcome = {title:"Hi, I'm Gigi", message:"", suggestions:[]};

/* ---------- persistence ---------- */
function load(){
  try{
    const raw = localStorage.getItem('gigi.chats');
    chats = raw ? JSON.parse(raw) : [];
  }catch{ chats = []; }
}
function save(){
  try{ localStorage.setItem('gigi.chats', JSON.stringify(chats.slice(0,25))); }catch{}
}
function activeChat(){ return chats.find(c => c.id === activeId); }

/* ---------- rendering ---------- */
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Answers arrive as plain text with bare URLs; make those clickable.
function linkify(text){
  return escapeHtml(text).replace(/(https?:\/\/[^\s<]+[^\s<.,;:)\]])/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function renderRecents(){
  els.recents.innerHTML = '';
  if(!chats.length){
    els.recents.innerHTML = '<li class="recents-empty">No chats yet</li>';
    return;
  }
  chats.forEach(chat => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.textContent = chat.title;
    btn.setAttribute('aria-current', chat.id === activeId ? 'true' : 'false');
    btn.onclick = () => { activeId = chat.id; render(); };
    li.appendChild(btn);
    els.recents.appendChild(li);
  });
}

function render(){
  renderRecents();
  els.inner.innerHTML = '';
  const chat = activeChat();

  if(!chat || !chat.messages.length){
    const w = document.createElement('div');
    w.className = 'welcome';
    w.innerHTML = `<h2>${escapeHtml(welcome.title)}</h2><p>${escapeHtml(welcome.message)}</p>`;
    const chips = document.createElement('div');
    chips.className = 'chips';
    (welcome.suggestions || []).forEach(q => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = q;
      b.onclick = () => ask(q);
      chips.appendChild(b);
    });
    w.appendChild(chips);
    els.inner.appendChild(w);
    return;
  }

  chat.messages.forEach((m, i) => {
    els.inner.appendChild(m.role === 'user' ? studentNode(m) : gigiNode(m, i));
  });
  els.thread.scrollTop = els.thread.scrollHeight;
}

function studentNode(m){
  const d = document.createElement('div');
  d.className = 'msg student';
  d.innerHTML = `<div class="bubble">${escapeHtml(m.content)}</div>`;
  return d;
}

function gigiNode(m, index){
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.innerHTML = `
    <div class="gigi-row">
      <span class="gigi-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F5F0ED" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14c0-3.9 3.1-7 7-7h3l3-2.5V8c1.6.9 2.6 2.6 2.6 4.4 0 3.6-3 6.6-6.6 6.6H8l-4 2.5V14Z"/>
          <circle cx="15.4" cy="10.4" r=".9" fill="#F5F0ED" stroke="none"/>
        </svg>
      </span>
      <div class="gigi-body"></div>
    </div>`;
  const body = wrap.querySelector('.gigi-body');

  if(m.pending){
    body.innerHTML = '<div class="thinking" role="status" aria-label="Gigi is looking that up"><i></i><i></i><i></i></div>';
    return wrap;
  }

  const answer = document.createElement('div');
  answer.className = 'answer';
  answer.innerHTML = linkify(m.content);
  body.appendChild(answer);

  if(m.sources && m.sources.length){
    const s = document.createElement('div');
    s.className = 'sources';
    m.sources.forEach(src => {
      const a = document.createElement('a');
      a.href = src.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = `${escapeHtml(src.title)} <span class="src-office">· ${escapeHtml(src.source||'')}</span>`;
      s.appendChild(a);
    });
    body.appendChild(s);
  }

  if(!m.error){
    body.appendChild(metaNode(m, index));
  }
  return wrap;
}

const CONFIDENCE_TEXT = {
  high:  'Strong match on the site',
  medium:'Partial match — worth confirming',
  low:   'Weak match — please verify',
};

function metaNode(m, index){
  const meta = document.createElement('div');
  meta.className = 'meta';

  const conf = document.createElement('span');
  conf.className = 'confidence ' + (m.confidence || 'low');
  conf.title = 'How closely this answer matched the pages Gigi found';
  conf.innerHTML = `<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
                    ${CONFIDENCE_TEXT[m.confidence] || CONFIDENCE_TEXT.low}`;
  meta.appendChild(conf);

  if(m.rated){
    const t = document.createElement('span');
    t.className = 'rate-thanks';
    t.textContent = m.rated === 'up' ? 'Thanks for the feedback' : 'Thanks — this helps Gigi improve';
    meta.appendChild(t);
    return meta;
  }

  const rate = document.createElement('div');
  rate.className = 'rate';
  const up = document.createElement('button');
  up.textContent = '👍'; up.setAttribute('aria-label','This answer helped');
  up.onclick = () => sendFeedback(index, 'up');
  const down = document.createElement('button');
  down.textContent = '👎'; down.setAttribute('aria-label','Report a wrong answer');
  down.onclick = () => showReport(index);
  rate.append(up, down);
  meta.appendChild(rate);
  return meta;
}

/* ---------- feedback ---------- */
function showReport(index){
  const chat = activeChat();
  const msg = chat.messages[index];
  const body = els.inner.querySelectorAll('.gigi-body')[
    chat.messages.slice(0, index + 1).filter(m => m.role === 'assistant').length - 1];
  if(!body || body.querySelector('.report')) return;

  const box = document.createElement('div');
  box.className = 'report';
  box.innerHTML = `
    <textarea placeholder="What was wrong? (optional — the more specific, the better)"></textarea>
    <div class="report-actions">
      <button type="button" data-act="send">Send report</button>
      <button type="button" class="ghost" data-act="cancel">Cancel</button>
    </div>`;
  box.querySelector('[data-act="send"]').onclick = () =>
    sendFeedback(index, 'down', box.querySelector('textarea').value.trim());
  box.querySelector('[data-act="cancel"]').onclick = () => box.remove();
  body.appendChild(box);
  box.querySelector('textarea').focus();
}

async function sendFeedback(index, rating, comment=''){
  const chat = activeChat();
  const msg = chat.messages[index];
  const question = (chat.messages[index-1] || {}).content || '';
  msg.rated = rating;
  save(); render();
  try{
    await fetch('/api/feedback', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, answer: msg.content, rating, comment}),
    });
  }catch(e){ console.error('feedback failed', e); }
}

/* ---------- asking ---------- */
async function ask(question){
  question = (question || '').trim();
  if(!question || busy) return;

  let chat = activeChat();
  if(!chat){
    chat = {id: String(Date.now()), title: question.slice(0,45), messages: []};
    chats.unshift(chat);
    activeId = chat.id;
  }

  chat.messages.push({role:'user', content:question});
  chat.messages.push({role:'assistant', content:'', pending:true});
  busy = true; els.send.disabled = true;
  save(); render();

  // Send only the turns before this question, trimmed for cost.
  const history = chat.messages
    .slice(0, -2)
    .filter(m => !m.pending)
    .slice(-6)
    .map(m => ({role: m.role, content: m.content}));

  try{
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, history}),
    });
    const data = await res.json();
    Object.assign(chat.messages[chat.messages.length-1], {
      content: data.answer || 'Something went wrong.',
      confidence: data.confidence, sources: data.sources || [],
      error: !!data.error, pending:false,
    });
  }catch(e){
    Object.assign(chat.messages[chat.messages.length-1], {
      content:"I couldn't reach the College of Business info just now. Try again in a moment.",
      pending:false, error:true, sources:[],
    });
  }finally{
    busy = false; els.send.disabled = false;
    save(); render();
    els.input.focus();
  }
}

/* ---------- composer ---------- */
function autoGrow(){
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 150) + 'px';
}
els.input.addEventListener('input', autoGrow);
els.input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    const q = els.input.value;
    els.input.value = ''; autoGrow();
    ask(q);
  }
});
els.send.onclick = () => {
  const q = els.input.value;
  els.input.value = ''; autoGrow();
  ask(q);
};

function newChat(){
  activeId = null;
  render();
  els.input.focus();
}
document.getElementById('newChat').onclick = newChat;
document.getElementById('newChatMobile').onclick = newChat;

/* ---------- boot ---------- */
(async function init(){
  load();
  try{
    const res = await fetch('/api/welcome');
    if(res.ok) welcome = await res.json();
  }catch{ /* fall back to the defaults above */ }
  render();
})();
</script>
</body>
</html>
